[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-search-hub"
version = "1.0.0"
description = "Deterministic federated search across configurable MCP providers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bjorn Melin" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastmcp==3.4.4",
    "pydantic-settings>=2.12,<3",
]

[project.scripts]
mcp-search-hub = "mcp_search_hub.main:main"

[project.urls]
Repository = "https://github.com/BjornMelin/mcp-search-hub"
Issues = "https://github.com/BjornMelin/mcp-search-hub/issues"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "httpx>=0.28,<1",
    "pyright>=1.1.407,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["mcp_search_hub*"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=mcp_search_hub",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mcp_search_hub"]
omit = ["mcp_search_hub/main.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.pyright]
include = ["mcp_search_hub", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "N", "RUF", "SIM", "UP"]
